version: '3.8'

services:
  # 1. Database Service (PostgreSQL + PostGIS)
  db:
    image: postgis/postgis:16-3.4 # Use an official PostGIS image
    container_name: sahbifit-db
    ports:
      - "5432:5432" # Expose DB port to your local machine (for debugging)
    environment:
      # These variables are pulled from the root .env file
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persist data
      - ./api/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend API Service (Spring Boot) - MODIFIED
  api:
    build:
      context: ./api # Points to the folder with the Dockerfile
      dockerfile: Dockerfile
    container_name: sahbifit-api
    ports:
      - "8080:8080" # Expose API port to your local machine
    depends_on:
      db:
        condition: service_healthy # Wait for the DB to be ready
    env_file:
      - .env # Load all variables from the root .env file
    environment:
      # This points to the file *inside* the container
      # This will override any value for this variable in the .env file
      - GOOGLE_APPLICATION_CREDENTIALS=/app-secrets/serviceAccountKey.json
    volumes:
      # Mount the Firebase key into the container at the path specified in .env
      # (This is your original volume mount)
      - ./secrets:/config
      
      # This maps your local Windows file to the path inside the container
      # as specified in your instructions.
      - C:/dev-secrets/sahbifit/serviceAccountKey.json:/app-secrets/serviceAccountKey.json
    
volumes:
  # Define the named volume for data persistence
  postgres_data: