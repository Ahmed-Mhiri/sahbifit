spring.application.name=api
# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/sahbifit_db
spring.datasource.username=sahbifit_user
spring.datasource.password=sahbifit_password

# JPA
spring.jpa.hibernate.ddl-auto=validate # Use Flyway/Liquibase for schema
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway (Recommended)
# Add 'Flyway Migration' to your pom.xml
spring.flyway.baseline-on-migrate=true