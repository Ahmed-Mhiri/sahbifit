spring.application.name=api

# --- Database ---
# Use environment variables if they exist, otherwise use the default values
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sahbifit_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sahbifit_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:horhor2004}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate 
# Good! Let Flyway handle changes.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway ---
spring.flyway.baseline-on-migrate=true


# ==================================
# WinSMS API Konfiguration
# ==================================
# Fügen Sie hier Ihren echten API-Schlüssel von WinSMS.tn ein
winsms.api-key=IHRE_ECHTE_API_TASTE_HIER
winsms.base-url=https://www.winsmspro.com/sms/sms/api


# ==================================
# Google reCAPTCHA v3 Konfiguration
# ==================================
# Holen Sie sich Ihren Schlüssel von https://www.google.com/recaptcha/admin/
recaptcha.secret-key=IHR_GEHEIMER_SCHLUESSEL_VON_GOOGLE_HIER
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# Der Mindest-Score (0.0 bis 1.0), den ein Benutzer haben muss.
# 0.5 ist ein gängiger Startwert.
recaptcha.score-threshold=0.5