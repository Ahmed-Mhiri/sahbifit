# Application Name
spring.application.name=api

# --- Database ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sahbifit_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sahbifit_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:horhor2004}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway ---
spring.flyway.baseline-on-migrate=true

# --- File Upload Limits ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ==================================
# WinSMS API Configuration
# ==================================
winsms.api-key=${WINSMS_API_KEY:IHRE_ECHTE_API_TASTE_HIER}
winsms.base-url=https://www.winsmspro.com/sms/sms/api

# ==================================
# Google reCAPTCHA v3 Configuration
# ==================================
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:IHR_GEHEIMER_SCHLUESSEL_VON_GOOGLE_HIER}
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify
recaptcha.score-threshold=${RECAPTCHA_SCORE_THRESHOLD:0.5}

# ==================================
# Cloudflare R2 Configuration
# ==================================
cloudflare.r2.access-key-id=${R2_ACCESS_KEY_ID:}
cloudflare.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME:sahbifit-verification}
cloudflare.r2.account-id=${R2_ACCOUNT_ID:}
