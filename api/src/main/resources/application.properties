spring.application.name=api

# --- Database ---
# Use environment variables if they exist, otherwise use the default values
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sahbifit_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sahbifit_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:horhor2004}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate 
# Good! Let Flyway handle changes.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway ---
spring.flyway.baseline-on-migrate=true