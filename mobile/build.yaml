targets:
  $default:
    builders:
      # --- json_serializable configuration (This was already correct) ---
      json_serializable:
        generate_for:
          - "lib/**/models/**.dart"

      # --- injectable_generator configuration (THIS IS THE FIX) ---
      injectable_generator:injectable_builder:
        options:
          # This forces the generator to scan your entire /lib folder
          # for annotations. It's much more reliable.
          auto_register: true

      # We don't need the 'injectable_config_builder' section
      # because the builder above handles everything.

      # --- auto_route_generator configuration (No changes needed) ---
      auto_route_generator:auto_route_generator:
        generate_for:
          - "lib/core/config/app_router.dart"