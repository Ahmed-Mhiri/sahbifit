name: sahbifit
description: its a gym buddy app that helps you find people partner(s) to train with

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Using a modern Dart SDK range

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1 # Updated from 8.1.3
  bloc: ^9.1.0 # Updated from 8.1.2
  equatable: ^2.0.7 # Updated from 2.0.5

  # Dependency Injection / Service Location
  get_it: ^9.0.5 # Updated from 7.6.4
  injectable: ^2.6.0 # Updated from 2.3.2

  # Networking
  dio: ^5.9.0 # Updated from 5.3.3

  # Models & State (Data Classes)
  freezed_annotation: ^3.1.0 # Updated from 2.4.1
  json_annotation: ^4.9.0 # Updated from 4.8.1

  # Secure Storage
  flutter_secure_storage: ^9.2.4 # Updated from 9.0.0

  # Firebase
  firebase_core: ^4.2.1 # Updated from 2.24.2
  firebase_messaging: ^16.0.4 # Updated from 14.7.10
  cloud_firestore: ^6.1.0 # Updated from 4.14.0

  # Routing
  auto_route: ^10.2.0 # Updated from 7.8.4

  # UI / Utils
  # google_fonts: ^6.1.0 # Removed to use local fonts

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0 # Updated from 3.0.2

  # Code Generation
  build_runner: ^2.4.13 # Updated from 2.4.6
  injectable_generator: ^2.9.1 # Updated from 2.4.1
  freezed: ^3.2.3 # Updated from 2.4.5
  json_serializable: ^6.11.1 # Updated from 6.7.1
  auto_route_generator: ^10.2.5 # Updated from 7.3.2

# Flutter-specific configuration
flutter:
  uses-material-design: true

  # Register assets
  assets:
    - assets/logo/ # Includes all files in this directory
    # - assets/images/ # Add this if you have other images

  # Register local fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400 # Default weight
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900