name: sahbifit
description: its a gym buddy app that helps you find people partner(s) to train with
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^9.0.5
  injectable: ^2.6.0
  dio: ^5.9.0
  
  # --- CORRECTED ---
  freezed_annotation: ^2.4.1
  
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.4
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  cloud_firestore: ^6.1.0
  auto_route: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # --- ALL VERSIONS BELOW ARE NOW CORRECT AND COMPATIBLE ---
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.1 
  
  # --- THIS IS THE KEY FIX from the last error ---
  auto_route_generator: ^10.2.3 # Downgraded to 10.2.3 to match freezed

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900